# Master key for the local arize-litellm proxy. Newer LiteLLM images refuse to
# boot without one. Demo-only value, cluster is local; the demo client reads the
# same value from config.yaml (litellm.api_key) or the LITELLM_API_KEY env var.
apiVersion: v1
kind: Secret
metadata:
  name: arize-litellm-key
  namespace: default
stringData:
  LITELLM_MASTER_KEY: sk-demo-45f693ee27fbdbbc3916cadb06fa3e088d1f2c5888d63e4f
